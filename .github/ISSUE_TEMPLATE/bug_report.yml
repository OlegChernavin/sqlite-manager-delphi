name: Bug report
description: Сообщить об ошибке
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за отчёт. Укажите шаги воспроизведения и окружение.
  - type: textarea
    id: description
    attributes:
      label: Описание
      description: Что произошло?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      placeholder: |
        1. Открыть БД ...
        2. Выполнить ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
    validations:
      required: true
  - type: input
    id: delphi
    attributes:
      label: Версия Delphi
      placeholder: "10.4.2 Sydney"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Платформа сборки
      options:
        - Win32
        - Win64
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows
      placeholder: "Windows 10 22H2"
    validations:
      required: true
